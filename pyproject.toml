[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axsdb"
version = "0.2.0.dev0"
description = "An absorption database reader for the Eradiate radiative transfer model."
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [{ name = "Vincent Leroy", email = "vincent.leroy@rayference.eu" }]
requires-python = ">=3.9"
keywords = [
  "radiative-transfer",
  "absorption",
  "spectroscopy",
  "atmosphere",
  "eradiate",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "attrs",
  "cachetools",
  "netcdf4",
  "numba>=0.58",
  "numpy",
  "pint",
  "scipy",
  "typer",
  "xarray>=2024.7.0",
]

[project.urls]
Homepage = "https://github.com/eradiate/axsdb"
Documentation = "https://axsdb.readthedocs.io"
Repository = "https://github.com/eradiate/axsdb"
Changelog = "https://github.com/eradiate/axsdb/blob/main/CHANGELOG.md"

[project.scripts]
axsdb = "axsdb.cli:main"

[dependency-groups]
test = [
  "coverage>=7.10.0",
  "pytest>=6",
  "pytest-cov",
  "pytest-datadir",
  "pytest-doctestplus",
  "rich",
]
docs = [
  "autodocsumm>=0.2.14",
  "myst-parser",
  "shibuya",
  "sphinx",
  "sphinx-autobuild>=2021",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design",
  "sphinx-iconify",
]
benchmark = ["pytest-benchmark", "pyinstrument"]
dev = [
  "poethepoet",
  "ruff",
  "sp-repo-review[cli]; python_version>='3.10'",
  { include-group = "test" },
  { include-group = "docs" },
  { include-group = "benchmark" },
]
pycharm = ["setuptools", { include-group = "dev" }]
interactive = ["jupyterlab", "matplotlib"]

[tool.coverage.html]
directory = "./reports/coverage/html"

[tool.coverage.json]
output = "./reports/coverage/coverage.json"

[tool.coverage.paths]
# Map CI runner source paths back to the local "src/" directory so that
# "coverage combine" can merge data collected on different OSes.
source = [
  "src/",
  "/home/runner/work/axsdb/axsdb/src/",
  "/Users/runner/work/axsdb/axsdb/src/",
  "D:\\a\\axsdb\\axsdb\\src\\",
]

[tool.coverage.report]
# Skip missing source files (e.g. third-party Cython .pyx) when combining
# coverage data from multiple OSes.
ignore_errors = true
omit = [
  "src/*/__init__.py",
  "src/*/cli.py",
  "src/*/_version.py",
  "src/*/testing/fixtures.py",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
parallel = true
source = ["src/"]

[tool.pytest.ini_options]
minversion = "6"
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error", "ignore:numpy.ndarray size changed:RuntimeWarning"]
addopts = [
  "-ra",
  "-vv",
  "--doctest-plus",
  "--doctest-glob='*.rst'",
  "--strict-config",
  "--strict-markers",
]

testpaths = ["tests", "src", "docs"]
norecursedirs = [".git", ".env", "dist", "__pypackages__"]
python_files = ["test_*.py", "*_test.py", "tests.py"]

doctest_plus = "enabled"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"

[tool.poe.tasks]
docs = { cmd = "sphinx-build -b html docs docs/_build/html", cwd = "." }
docs-clean = { cmd = "rm -rf docs/_build/", cwd = "." }
docs-serve = { cmd = "sphinx-autobuild docs docs/_build/html", cwd = "." }
docs-lock = { cmd = "uv export --frozen --no-hashes --output-file=docs/requirements.txt", cwd = "." }
test = { cmd = "pytest", cwd = "." }
test-cov = { cmd = "pytest --cov=src", cwd = "." }
test-cov-report = { cmd = "pytest --cov=src --cov-report=html", cwd = "." }
bench = { cmd = "pytest benchmarks", cwd = "." }
profile = { cmd = "pyinstrument -r html -o reports/profile.html", cwd = "." }
repo-review = { cmd = "repo-review .", cwd = "." }

[tool.repo-review.ignore]
MY100 = "Type checking will be applied later"
PC140 = "ty runs from a local hook against the pixi environment, not from the mirror."
PC111 = "ruff-format is scoped to Python; Markdown code blocks are not formatted"
PC160 = "No spell checker."
PC170 = "No rST formatter."
PC180 = "No Markdown formatter."
PC901 = "Not using pre-commit.ci."
PC902 = "Not using pre-commit.ci."
PC903 = "Not using pre-commit.ci."
